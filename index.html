
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mundo Aberto 3D</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    #joystick {
      position: fixed;
      left: 25px;
      bottom: 30px;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.4);
      z-index: 20;
      touch-action: none;
    }

    #stick {
      position: absolute;
      left: 35px;
      top: 35px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    #run {
      position: fixed;
      right: 25px;
      bottom: 35px;
      width: 75px;
      height: 75px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      font-weight: bold;
      z-index: 20;
      touch-action: none;
    }

    #look {
      position: fixed;
      right: 0;
      top: 0;
      width: 55%;
      height: 65%;
      z-index: 5;
      touch-action: none;
    }
  </style>
</head>

<body>

  <div id="hud">
    🌎 MUNDO ABERTO 3D<br>
    💰 Dinheiro: R$ 0
  </div>

  <canvas id="game"></canvas>

  <div id="look"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="run">CORRER</button>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================
    // CENA
    // =========================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    // =========================
    // CÂMERA
    // =========================

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      3000
    );

    camera.position.set(0, 8, 12);

    // =========================
    // RENDERIZADOR
    // =========================

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("game"),
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    // =========================
    // LUZ
    // =========================

    const sun = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    sun.position.set(300, 500, 200);

    sun.castShadow = true;

    scene.add(sun);

    const ambient = new THREE.HemisphereLight(
      0xffffff,
      0x668866,
      1.5
    );

    scene.add(ambient);

    // =========================
    // CHÃO
    // =========================

    const groundGeometry =
      new THREE.PlaneGeometry(
        1200,
        1200
      );

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x4d8b45
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.rotation.x = -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);

    // =========================
    // FUNÇÃO PARA CRIAR CUBO
    // =========================

    function criarCubo(
      x,
      y,
      z,
      largura,
      altura,
      profundidade,
      cor
    ) {

      const geometry =
        new THREE.BoxGeometry(
          largura,
          altura,
          profundidade
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: cor
        });

      const objeto =
        new THREE.Mesh(
          geometry,
          material
        );

      objeto.position.set(
        x,
        y,
        z
      );

      objeto.castShadow = true;
      objeto.receiveShadow = true;

      scene.add(objeto);

      return objeto;
    }

    // =========================
    // RUAS
    // =========================

    const roadMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x292929
      });

    function criarRua(
      x,
      z,
      largura,
      profundidade
    ) {

      const geometry =
        new THREE.BoxGeometry(
          largura,
          0.15,
          profundidade
        );

      const rua =
        new THREE.Mesh(
          geometry,
          roadMaterial
        );

      rua.position.set(
        x,
        0.08,
        z
      );

      scene.add(rua);
    }

    // Avenida principal
    criarRua(
      0,
      0,
      1200,
      35
    );

    criarRua(
      0,
      0,
      35,
      1200
    );

    // Ruas horizontais
    for (let z = -500; z <= 500; z += 100) {

      criarRua(
        0,
        z,
        1200,
        18
      );
    }

    // Ruas verticais
    for (let x = -500; x <= 500; x += 100) {

      criarRua(
        x,
        0,
        18,
        1200
      );
    }

    // =========================
    // PRÉDIOS
    // =========================

    function criarPredio(
      x,
      z,
      largura,
      altura,
      profundidade,
      cor
    ) {

      const predio =
        criarCubo(
          x,
          altura / 2,
          z,
          largura,
          altura,
          profundidade,
          cor
        );

      return predio;
    }

    const coresPredios = [
      0x8d99ae,
      0x6c757d,
      0xb0bec5,
      0x455a64,
      0x78909c,
      0x9e9e9e
    ];

    // =========================
    // CENTRO DA CIDADE
    // =========================

    criarPredio(
      -70,
      -70,
      45,
      180,
      45,
      0x37474f
    );

    criarPredio(
      70,
      -70,
      40,
      140,
      40,
      0x607d8b
    );

    criarPredio(
      -70,
      70,
      50,
      220,
      50,
      0x455a64
    );

    criarPredio(
      70,
      70,
      45,
      160,
      45,
      0x78909c
    );

    // =========================
    // OUTROS PRÉDIOS
    // =========================

    for (let i = 0; i < 70; i++) {

      const x =
        Math.floor(
          (Math.random() * 1000 - 500) / 100
        ) * 100 + 40;

      const z =
        Math.floor(
          (Math.random() * 1000 - 500) / 100
        ) * 100 + 40;

      // Não colocar muito perto do centro
      if (
        Math.abs(x) < 120 &&
        Math.abs(z) < 120
      ) {
        continue;
      }

      const largura =
        25 + Math.random() * 30;

      const profundidade =
        25 + Math.random() * 30;

      const altura =
        30 + Math.random() * 130;

      const cor =
        coresPredios[
          Math.floor(
            Math.random() *
            coresPredios.length
          )
        ];

      criarPredio(
        x,
        z,
        largura,
        altura,
        profundidade,
        cor
      );
    }

    // =========================
    // CASAS
    // =========================

    function criarCasa(
      x,
      z
    ) {

      // casa
      criarCubo(
        x,
        5,
        z,
        22,
        10,
        18,
        0xe0d2b8
      );

      // telhado
      const roofGeometry =
        new THREE.ConeGeometry(
          15,
          8,
          4
        );

      const roofMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x8b3e2f
        });

      const roof =
        new THREE.Mesh(
          roofGeometry,
          roofMaterial
        );

      roof.position.set(
        x,
        14,
        z
      );

      roof.rotation.y =
        Math.PI / 4;

      roof.castShadow = true;

      scene.add(roof);

      // porta
      criarCubo(
        x,
        3,
        z - 9.2,
        4,
        6,
        0.5,
        0x553322
      );
    }

    for (let i = 0; i < 25; i++) {

      const x =
        -450 +
        Math.random() * 900;

      const z =
        -450 +
        Math.random() * 900;

      criarCasa(
        x,
        z
      );
    }

    // =========================
    // MERCADO
    // =========================

    criarCubo(
      230,
      12,
      230,
      55,
      24,
      45,
      0xf1f1f1
    );

    criarCubo(
      230,
      25,
      206,
      45,
      5,
      2,
      0xff3333
    );

    // =========================
    // BANCO
    // =========================

    criarCubo(
      -230,
      12,
      -230,
      50,
      24,
      40,
      0xd7c08a
    );

    criarCubo(
      -230,
      27,
      -251,
      40,
      5,
      2,
      0x2455a4
    );

    // =========================
    // LOTES
    // =========================

    function criarLote(
      x,
      z
    ) {

      const geometry =
        new THREE.BoxGeometry(
          45,
          0.2,
          35
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x777777
        });

      const lote =
        new THREE.Mesh(
          geometry,
          material
        );

      lote.position.set(
        x,
        0.2,
        z
      );

      scene.add(lote);

      // pequena placa
      criarCubo(
        x,
        3,
        z,
        5,
        6,
        1,
        0xffffff
      );
    }

    criarLote(
      300,
      -300
    );

    criarLote(
      360,
      -300
    );

    criarLote(
      300,
      -350
    );

    // =========================
    // ÁRVORES
    // =========================

    function criarArvore(
      x,
      z
    ) {

      // tronco
      criarCubo(
        x,
        4,
        z,
        2,
        8,
        2,
        0x6b4423
      );

      const treeGeometry =
        new THREE.SphereGeometry(
          6,
          12,
          12
        );

      const treeMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x236b2b
        });

      const copa =
        new THREE.Mesh(
          treeGeometry,
          treeMaterial
        );

      copa.position.set(
        x,
        11,
        z
      );

      copa.castShadow = true;

      scene.add(copa);
    }

    for (let i = 0; i < 80; i++) {

      criarArvore(
        -550 +
        Math.random() * 1100,

        -550 +
        Math.random() * 1100
      );
    }

    // =========================
    // CARROS
    // =========================

    const carros = [];

    function criarCarro(
      x,
      z,
      cor
    ) {

      const carro =
        criarCubo(
          x,
          2,
          z,
          10,
          4,
          5,
          cor
        );

      carro.userData.velocidade =
        0.4 +
        Math.random() * 0.5;

      carros.push(carro);
    }

    for (let i = 0; i < 15; i++) {

      criarCarro(
        -500 +
        Math.random() * 1000,

        -17,

        0xffffff *
        Math.random()
      );
    }

    // =========================
    // JOGADOR
    // =========================

    const player =
      criarCubo(
        0,
        3,
        80,
        4,
        6,
        4,
        0x1769aa
      );

    player.userData.velocidade = 0.25;

    // =========================
    // CONTROLES
    // =========================

    const joystick =
      document.getElementById(
        "joystick"
      );

    const stick =
      document.getElementById(
        "stick"
      );

    const runButton =
      document.getElementById(
        "run"
      );

    let moveX = 0;
    let moveZ = 0;
    let correndo = false;

    let joystickAtivo = false;

    function atualizarJoystick(
      clientX,
      clientY
    ) {

      const rect =
        joystick.getBoundingClientRect();

      const centroX =
        rect.left +
        rect.width / 2;

      const centroY =
        rect.top +
        rect.height / 2;

      let dx =
        clientX - centroX;

      let dy =
        clientY - centroY;

      const distancia =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      const limite = 35;

      if (distancia > limite) {

        dx =
          dx /
          distancia *
          limite;

        dy =
          dy /
          distancia *
          limite;
      }

      stick.style.transform =
        `translate(${dx}px, ${dy}px)`;

      moveX =
        dx / limite;

      moveZ =
        dy / limite;
    }

    joystick.addEventListener(
      "touchstart",
      function(e) {

        joystickAtivo = true;

        const t =
          e.touches[0];

        atualizarJoystick(
          t.clientX,
          t.clientY
        );

        e.preventDefault();
      },
      { passive: false }
    );

    joystick.addEventListener(
      "touchmove",
      function(e) {

        if (!joystickAtivo)
          return;

        const t =
          e.touches[0];

        atualizarJoystick(
          t.clientX,
          t.clientY
        );

        e.preventDefault();
      },
      { passive: false }
    );

    joystick.addEventListener(
      "touchend",
      function() {

        joystickAtivo = false;

        moveX = 0;
        moveZ = 0;

        stick.style.transform =
          "translate(0px, 0px)";
      }
    );

    // =========================
    // BOTÃO CORRER
    // =========================

    runButton.addEventListener(
      "touchstart",
      function(e) {

        correndo = true;

        e.preventDefault();
      },
      { passive: false }
    );

    runButton.addEventListener(
      "touchend",
      function() {

        correndo = false;
      }
    );

    // =========================
    // CÂMERA
    // =========================

    let cameraAngle = 0;

    let olhando = false;
    let ultimoX = 0;

    const look =
      document.getElementById(
        "look"
      );

    look.addEventListener(
      "touchstart",
      function(e) {

        olhando = true;

        ultimoX =
          e.touches[0].clientX;

        e.preventDefault();
      },
      { passive: false }
    );

    look.addEventListener(
      "touchmove",
      function(e) {

        if (!olhando)
          return;

        const x =
          e.touches[0].clientX;

        const diferenca =
          x - ultimoX;

        cameraAngle -=
          diferenca * 0.008;

        ultimoX = x;

        e.preventDefault();
      },
      { passive: false }
    );

    look.addEventListener(
      "touchend",
      function() {

        olhando = false;
      }
    );

    // =========================
    // JOGO
    // =========================

    function animar() {

      requestAnimationFrame(
        animar
      );

      // velocidade
      let velocidade =
        player.userData.velocidade;

      if (correndo) {
        velocidade *= 2;
      }

      // movimento
      const frenteX =
        Math.sin(cameraAngle);

      const frenteZ =
        Math.cos(cameraAngle);

      player.position.x +=
        (
          moveX * Math.cos(cameraAngle) +
          moveZ * frenteX
        ) * velocidade;

      player.position.z +=
        (
          moveX * -frenteX +
          moveZ * frenteZ
        ) * velocidade;

      // carros
      for (const carro of carros) {

        carro.position.x +=
          carro.userData.velocidade;

        if (
          carro.position.x >
          600
        ) {

          carro.position.x =
            -600;
        }
      }

      // câmera atrás do jogador
      const distanciaCamera = 18;

      camera.position.x =
        player.position.x -
        Math.sin(cameraAngle) *
        distanciaCamera;

      camera.position.z =
        player.position.z -
        Math.cos(cameraAngle) *
        distanciaCamera;

      camera.position.y =
        player.position.y +
        10;

      camera.lookAt(
        player.position.x,
        player.position.y + 2,
        player.position.z
      );

      renderer.render(
        scene,
        camera
      );
    }

    animar();

    // =========================
    // AJUSTE DA TELA
    // =========================

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );

  </script>

</body>
</html>
