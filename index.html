/* =====================================
   RUAS
===================================== */

function criarRua(x,z,w,d){

  const rua =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      .18,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0x303030
    })
  );

  rua.position.set(
    x,.09,z
  );

  cena.add(rua);

  /* faixas */

  if(w<d){

    for(let zz=z-d/2+15;
        zz<z+d/2;
        zz+=25){

      const faixa =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .5,
          .03,
          10
        ),
        new THREE.MeshStandardMaterial({
          color:0xf2f2f2
        })
      );

      faixa.position.set(
        x,
        .2,
        zz
      );

      cena.add(faixa);
    }

  }else{

    for(let xx=x-w/2+15;
        xx<x+w/2;
        xx+=25){

      const faixa =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          10,
          .03,
          .5
        ),
        new THREE.MeshStandardMaterial({
          color:0xf2f2f2
        })
      );

      faixa.position.set(
        xx,
        .2,
        z
      );

      cena.add(faixa);
    }
  }
}

/* =====================================
   PRÉDIOS
===================================== */

function criarPredio(x,z,h,w=55,d=55){

  const p =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        .35+Math.random()*.25,
        .35+Math.random()*.25,
        .38+Math.random()*.25
      )
    })
  );

  p.position.set(
    x,h/2,z
  );

  p.castShadow=true;

  cena.add(p);

  /* janelas frontais */

  for(let y=9;y<h-4;y+=12){

    for(let xx=-w/2+8;
        xx<w/2-3;
        xx+=12){

      const janela =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          6,5,.4
        ),
        new THREE.MeshStandardMaterial({
          color:0x8ed4f5
        })
      );

      janela.position.set(
        x+xx,
        y,
        z-d/2-.25
      );

      cena.add(janela);
    }
  }
}

function criarCarro(x,z,direcao){

  const carro =
  new THREE.Group();


  const corpo =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      7,2.5,12
    ),
    new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        Math.random(),
        .2+Math.random()*.5,
        .2+Math.random()*.5
      )
    })
  );

  corpo.position.y=2;

  carro.add(corpo);


  const teto =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      5,2.2,6
    ),
    new THREE.MeshStandardMaterial({
      color:0x222222
    })
  );

  teto.position.y=4;

  carro.add(teto);


  carro.position.set(
    x,0,z
  );

  cena.add(carro);


  return carro;
}
