
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Mundo Aberto 3D</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #jogo {
      width: 100%;
      height: 100%;
      display: block;
    }

    #informacoes {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;

      padding: 12px 16px;

      color: white;
      background: rgba(0, 0, 0, 0.65);

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.5;
    }

    #joystick {
      position: fixed;
      left: 25px;
      bottom: 25px;

      width: 125px;
      height: 125px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.4);

      z-index: 20;

      touch-action: none;
    }

    #controle {
      position: absolute;

      width: 55px;
      height: 55px;

      left: 33px;
      top: 33px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.8);

      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    #correr {
      position: fixed;

      right: 25px;
      bottom: 35px;

      width: 78px;
      height: 78px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,0.8);

      font-weight: bold;

      z-index: 20;

      touch-action: none;
    }
  </style>
</head>

<body>

  <div id="informacoes">
    🌎 MUNDO ABERTO 3D<br>
    🏙️ Cidade 1<br>
    💰 Dinheiro: R$ 0
  </div>

  <canvas id="jogo"></canvas>

  <div id="joystick">
    <div id="controle"></div>
  </div>

  <button id="correr">CORRER</button>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    // ==================================================
    // CENA
    // ==================================================

    const cena = new THREE.Scene();

    cena.background =
      new THREE.Color(0x87ceeb);


    // ==================================================
    // CÂMERA
    // ==================================================

    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        5000
      );


    // ==================================================
    // RENDERIZADOR
    // ==================================================

    const renderizador =
      new THREE.WebGLRenderer({
        canvas: document.getElementById("jogo"),
        antialias: true
      });

    renderizador.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderizador.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderizador.shadowMap.enabled = true;


    // ==================================================
    // ILUMINAÇÃO
    // ==================================================

    const sol =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    sol.position.set(
      500,
      800,
      400
    );

    sol.castShadow = true;

    cena.add(sol);


    const luzAmbiente =
      new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.5
      );

    cena.add(luzAmbiente);


    // ==================================================
    // TERRENO GRANDE
    // ==================================================

    const terrenoGeometria =
      new THREE.PlaneGeometry(
        2000,
        2000
      );

    const terrenoMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x4f8f48
      });

    const terreno =
      new THREE.Mesh(
        terrenoGeometria,
        terrenoMaterial
      );

    terreno.rotation.x =
      -Math.PI / 2;

    terreno.receiveShadow = true;

    cena.add(terreno);


    // ==================================================
    // FUNÇÃO PARA CRIAR OBJETOS
    // ==================================================

    function criarBloco(
      x,
      y,
      z,
      largura,
      altura,
      profundidade,
      cor
    ) {

      const geometria =
        new THREE.BoxGeometry(
          largura,
          altura,
          profundidade
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: cor
        });

      const objeto =
        new THREE.Mesh(
          geometria,
          material
        );

      objeto.position.set(
        x,
        y,
        z
      );

      objeto.castShadow = true;
      objeto.receiveShadow = true;

      cena.add(objeto);

      return objeto;
    }


    // ==================================================
    // ESTRUTURA DA CIDADE
    // ==================================================

    const materialRua =
      new THREE.MeshStandardMaterial({
        color: 0x292929
      });


    function criarRua(
      x,
      z,
      largura,
      comprimento
    ) {

      const geometria =
        new THREE.BoxGeometry(
          largura,
          0.2,
          comprimento
        );

      const rua =
        new THREE.Mesh(
          geometria,
          materialRua
        );

      rua.position.set(
        x,
        0.1,
        z
      );

      cena.add(rua);
    }


    // ==================================================
    // AVENIDAS PRINCIPAIS
    // ==================================================

    criarRua(
      0,
      0,
      40,
      1900
    );

    criarRua(
      0,
      0,
      1900,
      40
    );


    // ==================================================
    // RUAS DOS BAIRROS
    // ==================================================

    for (
      let z = -900;
      z <= 900;
      z += 120
    ) {

      criarRua(
        0,
        z,
        18,
        1900
      );
    }


    for (
      let x = -900;
      x <= 900;
      x += 120
    ) {

      criarRua(
        x,
        0,
        18,
        1900
      );
    }


    // ==================================================
    // PRAÇA CENTRAL
    // ==================================================

    criarBloco(
      0,
      0.2,
      0,
      100,
      0.4,
      100,
      0x6da95b
    );


    // ==================================================
    // ÁREA DO CENTRO
    // ==================================================

    const centroPredios = [

      [-70, -70, 45, 180, 45],
      [70, -70, 45, 140, 45],
      [-70, 70, 45, 220, 45],
      [70, 70, 45, 160, 45],

      [-180, -70, 40, 100, 40],
      [180, -70, 40, 120, 40],
      [-180, 70, 40, 90, 40],
      [180, 70, 40, 150, 40]

    ];


    for (
      const predio of centroPredios
    ) {

      criarBloco(
        predio[0],
        predio[3] / 2,
        predio[1],
        predio[2],
        predio[3],
        predio[4],
        0x667985
      );
    }


    // ==================================================
    // BAIRROS
    // ==================================================

    // Espaços reservados para futuras áreas:

    const bairros = {

      centro: {
        x: 0,
        z: 0
      },

      residencialNorte: {
        x: 0,
        z: -400
      },

      residencialSul: {
        x: 0,
        z: 400
      },

      comercialLeste: {
        x: 400,
        z: 0
      },

      comercialOeste: {
        x: -400,
        z: 0
      },

      mansoes: {
        x: 650,
        z: -500
      },

      aeroporto: {
        x: 750,
        z: 650
      }

    };


    // ==================================================
    // JOGADOR
    // ==================================================

    const jogador =
      criarBloco(
        0,
        3,
        100,
        4,
        6,
        4,
        0x1769aa
      );


    jogador.userData.velocidade =
      0.35;


    // ==================================================
    // CONTROLE
    // ==================================================

    const joystick =
      document.getElementById(
        "joystick"
      );

    const controle =
      document.getElementById(
        "controle"
      );

    const botaoCorrer =
      document.getElementById(
        "correr"
      );


    let movimentoX = 0;
    let movimentoZ = 0;

    let correndo = false;

    let joystickAtivo = false;


    function moverJoystick(
      x,
      y
    ) {

      const rect =
        joystick.getBoundingClientRect();

      const centroX =
        rect.left +
        rect.width / 2;

      const centroY =
        rect.top +
        rect.height / 2;


      let dx =
        x - centroX;

      let dy =
        y - centroY;


      const distancia =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const limite = 35;


      if (
        distancia > limite
      ) {

        dx =
          dx / distancia * limite;

        dy =
          dy / distancia * limite;
      }


      controle.style.transform =
        `translate(${dx}px, ${dy}px)`;


      movimentoX =
        dx / limite;

      movimentoZ =
        dy / limite;
    }


    joystick.addEventListener(
      "touchstart",
      function(evento) {

        joystickAtivo = true;

        const toque =
          evento.touches[0];

        moverJoystick(
          toque.clientX,
          toque.clientY
        );

        evento.preventDefault();

      },
      { passive: false }
    );


    joystick.addEventListener(
      "touchmove",
      function(evento) {

        if (!joystickAtivo)
          return;

        const toque =
          evento.touches[0];

        moverJoystick(
          toque.clientX,
          toque.clientY
        );

        evento.preventDefault();

      },
      { passive: false }
    );


    joystick.addEventListener(
      "touchend",
      function() {

        joystickAtivo = false;

        movimentoX = 0;
        movimentoZ = 0;

        controle.style.transform =
          "translate(0px, 0px)";
      }
    );


    // ==================================================
    // CORRER
    // ==================================================

    botaoCorrer.addEventListener(
      "touchstart",
      function(evento) {

        correndo = true;

        evento.preventDefault();

      },
      { passive: false }
    );


    botaoCorrer.addEventListener(
      "touchend",
      function() {

        correndo = false;

      }
    );


    // ==================================================
    // CÂMERA
    // ==================================================

    camera.position.set(
      0,
      10,
      120
    );


    // ==================================================
    // LOOP DO JOGO
    // ==================================================

    function atualizar() {

      requestAnimationFrame(
        atualizar
      );


      let velocidade =
        jogador.userData.velocidade;


      if (correndo) {

        velocidade *= 2;
      }


      jogador.position.x +=
        movimentoX * velocidade;


      jogador.position.z +=
        movimentoZ * velocidade;


      // câmera acompanha o jogador

      camera.position.x =
        jogador.position.x;

      camera.position.z =
        jogador.position.z + 18;

      camera.position.y =
        jogador.position.y + 10;


      camera.lookAt(
        jogador.position.x,
        jogador.position.y,
        jogador.position.z
      );


      renderizador.render(
        cena,
        camera
      );
    }


    atualizar();


    // ==================================================
    // AJUSTE DA TELA
    // ==================================================

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderizador.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
